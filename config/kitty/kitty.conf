# =========================
# Kitty конфигурация
# Не запускать через: source kitty.conf
# Применение:
#   kitty @ load-config ~/.config/kitty/kitty.conf
# =========================

# ==== Основные параметры окна ====
background_opacity        0.84
hide_window_decorations   yes

allow_remote_control      yes
sync_to_monitor           no

# =========================
# Шрифты
# =========================
font_family               JetBrainsMono Nerd Font Mono
bold_font                 auto
italic_font               auto
font_size                 18.5

adjust_line_height        0
adjust_column_width       0
disable_ligatures         cursor

# =========================
# Отступы окна
# =========================
window_padding_width      8

# =========================
# Цветовая схема Kanagawa
# =========================
foreground                #DCD7BA
background                #26231F
selection_foreground      #DCD7BA
selection_background      #2D4F67
cursor                    #C0A36E
cursor_text_color         #1F1F28
url_color                 #7AA89F

# Basic ANSI colors
color0                    #1F1F28
color1                    #C34043
color2                    #76946A
color3                    #C0A36E
color4                    #7E9CD8
color5                    #957FB8
color6                    #7AA89F
color7                    #DCD7BA

# Bright ANSI colors
color8                    #727169
color9                    #E82424
color10                   #98BB6C
color11                   #E6C384
color12                   #7FB4CA
color13                   #D27E99
color14                   #7AA89F
color15                   #C8C093

# Tab bar
active_tab_foreground     #1F1F28
active_tab_background     #7AA89F
inactive_tab_foreground   #727169
inactive_tab_background   #16161D
tab_bar_background        #16161D

# =========================
# Курсор
# =========================
cursor_shape              beam
cursor_blink_interval     0.6
cursor_stop_blinking_after 15.0

# =========================
# Плавность/рендер
# =========================
input_delay               1
repaint_delay             4

# =========================
# Скроллинг
# =========================
scrollback_lines          3000
wheel_scroll_min_lines    3
mouse_hide_wait           0.5

# =========================
# Мышь / клавиши
# =========================
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

mouse_map left press ungrabbed mouse_selection normal
mouse_map left drag  ungrabbed mouse_selection extend

mouse_map wheel_up   pressed=shift send_text all "\x1b[5;2~"
mouse_map wheel_down pressed=shift send_text all "\x1b[6;2~"

# =========================
# Заголовок окна / табов
# =========================
active_tab_title_template   "🐈"
inactive_tab_title_template "🐈"

# =========================
# Поведение
# =========================
confirm_os_window_close    0
enable_audio_bell          no
linux_display_server       x11
shell                      fish

cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0
