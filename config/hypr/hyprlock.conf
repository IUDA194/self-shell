general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

background {
    monitor =
    path = ~/.cache/self-shell/lockscreen-wallpaper.png
    color = rgba(26, 22, 20, 1.0)
    blur_passes = 3
    blur_size = 8
    brightness = 0.62
    contrast = 1.08
    vibrancy = 0.12
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(221, 211, 198, 1.0)
    font_size = 86
    font_family = JetBrainsMono Nerd Font
    position = 0, 145
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.65)
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(207, 197, 186, 0.86)
    font_size = 18
    font_family = Noto Sans
    position = 0, 72
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = true
    outer_color = rgba(181, 142, 102, 0.85)
    inner_color = rgba(35, 29, 25, 0.88)
    font_color = rgba(221, 211, 198, 1.0)
    check_color = rgba(138, 160, 138, 1.0)
    fail_color = rgba(196, 116, 110, 1.0)
    capslock_color = rgba(217, 164, 108, 1.0)
    placeholder_text = <i>Введите пароль…</i>
    fail_text = <i>Неверный пароль ($ATTEMPTS)</i>
    rounding = 18
    position = 0, -55
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.55)
}

label {
    monitor =
    text = 󰌌  EN
    color = rgba(221, 211, 198, 0.90)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 238, -55
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.55)
}

label {
    monitor =
    text =   $USER
    color = rgba(207, 197, 186, 0.75)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -118
    halign = center
    valign = center
}
