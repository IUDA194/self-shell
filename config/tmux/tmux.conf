set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -g allow-passthrough on

  set -g allow-passthrough on
  set -as terminal-features ',xterm-kitty:RGB'

# Основной префикс
set -g prefix C-a

# Сортировка по имени
bind s choose-tree -sZ -O name

# Изменение индексов
set -g base-index 1
setw -g pane-base-index 1

# Переназначение клавиш
unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind M command-prompt -p "session name:" "new-session -A -s '%%'"


bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection 

set -s copy-command "wl-copy"
set -s set-clipboard on

bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

unbind -T copy-mode-vi MouseDragEnd1Pane
# Плагины
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Obsidian warm colors (matched with fish + waybar theme)
set -gu @themepack
set -g status-style "bg=default,fg=#CCC2B7"
set -g status-interval 60
set -g status-justify "left"
set -g status-left-length 20
set -g status-right-length 80
set -g message-style "bg=default,fg=#CCC2B7"
set -g message-command-style "bg=default,fg=#CCC2B7"

set -g pane-border-style "fg=#746961"
set -g pane-active-border-style "fg=#BA945F"

set -g window-status-style "fg=#8F847A,bg=default"
set -g window-status-current-style "fg=#BA945F,bg=default,bold"
set -g window-status-activity-style "fg=#BA945F,bg=default,bold"
set -g window-status-bell-style "fg=#9F7D52,bg=default,bold"
set -g window-status-separator ""
set -g window-status-format "#[fg=#8F847A,bg=default] #I:#W "
set -g window-status-current-format "#[fg=#BA945F,bg=default,bold] #I:#W "

set -g status-left-style "fg=#BA945F,bg=default"
set -g status-right-style "fg=#ADA59C,bg=default"
set -g status-left '#[fg=#BA945F,bold] #S '
set -g status-right '#(~/.local/bin/tmux-state-save >/dev/null 2>&1)#[fg=#ADA59C]%Y-%m-%d #[fg=#746961]| #[fg=#CCC2B7,bold]%H:%M '

set -g mode-style "bg=#372D29,fg=#CCC2B7"
set -g clock-mode-colour "#BA945F"

bind S run-shell -b '~/.local/bin/tmux-state-save'
# bind R run-shell -b '~/.local/bin/tmux-state-restore'

set-hook -g after-new-session 'run-shell -b "~/.local/bin/tmux-state-save"'
set-hook -g after-new-window 'run-shell -b "~/.local/bin/tmux-state-save"'
set-hook -g after-split-window 'run-shell -b "~/.local/bin/tmux-state-save"'
set-hook -g session-closed 'run-shell -b "~/.local/bin/tmux-state-save"'
set-hook -g window-layout-changed 'run-shell -b "~/.local/bin/tmux-state-save"'
set-hook -g window-renamed 'run-shell -b "~/.local/bin/tmux-state-save"'
set-hook -g client-detached 'run-shell -b "~/.local/bin/tmux-state-save"'
# run-shell -b '~/.local/bin/tmux-state-restore'

# Старт менеджера плагинов, если TPM установлен
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"

run-shell 'fish_path="$(command -v fish 2>/dev/null)"; if [ -n "$fish_path" ]; then tmux set-option -g default-shell "$fish_path"; tmux set-option -g default-command "$fish_path"; fi'
